name: CI-CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: k8s-cicd-starter:ci
  CLUSTER: ci-cluster

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build-scan-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.69.3 \
            image --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-unfixed --no-progress "$IMAGE"

      - name: Create temporary kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: ${{ env.CLUSTER }}

      - name: Load image into the cluster
        run: kind load docker-image "$IMAGE" --name "$CLUSTER"

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/web --timeout=120s
          kubectl get pods,svc,hpa

      - name: Smoke test /health
        run: |
          kubectl port-forward svc/web 8080:80 &
          sleep 5
          curl -fsS http://localhost:8080/health
