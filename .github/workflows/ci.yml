name: CI-CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-scan-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t webapp:local .

      - name: Security scan with Trivy (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: webapp:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Create a test Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: kind


      - name: Load image and deploy
        run: |
          kind load docker-image webapp:local
          kubectl apply -f deployment.yaml -f service.yaml
          kubectl rollout status deployment/webapp --timeout=120s
          kubectl get pods

  push-image:
    needs: build-scan-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to GitHub Container Registry
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/k8s-cicd-starter:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
